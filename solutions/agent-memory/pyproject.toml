[project]
name = "agent-memory"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.39.11",
    "cognee[neptune,aws]>=1.4.0",
    "mem0ai[extras]>=1.0.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "opensearch-py>=3.0.0",
    "python-dotenv>=1.2.2",
    "graphiti_core>=0.19.0",
    "streamlit>=1.48.1",
    "strands-agents>=1.5.0",
    "strands-agents-tools>=0.2.4",
    "ddgs>=9.5.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real AWS infrastructure (Neptune, OpenSearch, Bedrock)",
]

[tool.uv]
# cognee 1.6.x declares huggingface-hub<1, but transformers>=5.10 (needed for
# transformers security fixes) requires huggingface-hub>=1.5.
override-dependencies = ["huggingface-hub>=1.5,<2"]
# Security floor (not a direct dependency): filelock <=4.2.0 has a high-severity
# advisory. Newest litellm (1.106.x) declares filelock<4, so the resolver
# settles on a slightly older litellm (still above its own security fix).
constraint-dependencies = ["filelock>=4.2.1"]
