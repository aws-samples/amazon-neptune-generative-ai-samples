<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-label="What runs in your account" style="font-family:'Amazon Ember',Helvetica,Arial,sans-serif"><title>What runs in your account</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8998"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3cc4"/></marker><marker id="ahD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e5bba"/></marker><marker id="ahN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker></defs><rect width="1180" height="640" fill="#fff"/><text x="30" y="36" font-size="20" fill="#16191f" font-weight="700" text-anchor="start" style="">What runs in your account</text><text x="30" y="58" font-size="13" fill="#414d5c" font-weight="400" text-anchor="start" style="">The agent decides. DynamoDB records each step as it happens. A stream projects each decision into the graph.</text><rect x="30" y="92" width="250" height="92" rx="10" fill="#ffffff" stroke="#c6c6cd" stroke-width="1.2"/><text x="44" y="116" font-size="14" fill="#16191f" font-weight="700" text-anchor="start" style="">JupyterLab notebook</text><text x="44" y="136" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">SageMaker AI notebook instance:</text><text x="44" y="153" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">runs the agent, reads the evidence</text><rect x="900" y="92" width="250" height="92" rx="10" fill="#ffffff" stroke="#c6c6cd" stroke-width="1.2"/><text x="914" y="116" font-size="14" fill="#16191f" font-weight="700" text-anchor="start" style="">MCP server</text><text x="914" y="136" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">AgentCore Runtime: your saved</text><text x="914" y="153" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">queries as tools for Kiro, read-only</text><rect x="30" y="250" width="250" height="128" rx="10" fill="#fcefe8" stroke="#b3471b" stroke-width="1.4"/><text x="44" y="274" font-size="14" fill="#b3471b" font-weight="700" text-anchor="start" style="">Underwriting agent</text><text x="44" y="294" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">AgentCore Runtime</text><text x="44" y="311" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">Claude Sonnet 5</text><text x="44" y="328" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">five tools: credit, income,</text><text x="44" y="345" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">DTI, property value, policy search</text><rect x="209.8" y="260" width="60.199999999999996" height="18" rx="9" fill="#b3471b" stroke="#b3471b" stroke-width="1.2"/><text x="239.9" y="273" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" style="">decides</text><rect x="320" y="250" width="250" height="128" rx="10" fill="#e9f0fd" stroke="#2e5bba" stroke-width="1.4"/><text x="334" y="274" font-size="14" fill="#2e5bba" font-weight="700" text-anchor="start" style="">Amazon DynamoDB</text><text x="334" y="294" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">dat408-agent-traces</text><text x="334" y="311" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">one item per step, written</text><text x="334" y="328" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">once, as the agent decides;</text><text x="334" y="345" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">3,000,000 past decisions</text><rect x="499.8" y="260" width="60.199999999999996" height="18" rx="9" fill="#2e5bba" stroke="#2e5bba" stroke-width="1.2"/><text x="529.9" y="273" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" style="">records</text><rect x="610" y="250" width="250" height="128" rx="10" fill="#ffffff" stroke="#c6c6cd" stroke-width="1.2"/><text x="624" y="274" font-size="14" fill="#16191f" font-weight="700" text-anchor="start" style="">AWS Lambda</text><text x="624" y="294" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">the stream transform:</text><text x="624" y="311" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">each new step, from</text><text x="624" y="328" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">DynamoDB Streams, MERGEd</text><text x="624" y="345" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">into the graph; replay-safe</text><rect x="900" y="250" width="250" height="128" rx="10" fill="#e6f4f1" stroke="#0f7b6c" stroke-width="1.4"/><text x="914" y="274" font-size="14" fill="#0f7b6c" font-weight="700" text-anchor="start" style="">Neptune Analytics</text><text x="914" y="294" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">what decisions share</text><text x="914" y="311" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">what each result was built from</text><text x="914" y="328" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">the Knowledge Base&#x27;s passages</text><rect x="1073.2" y="260" width="66.8" height="18" rx="9" fill="#0f7b6c" stroke="#0f7b6c" stroke-width="1.2"/><text x="1106.6" y="273" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" style="">connects</text><rect x="30" y="452" width="250" height="92" rx="10" fill="#ffffff" stroke="#c6c6cd" stroke-width="1.2"/><text x="44" y="476" font-size="14" fill="#16191f" font-weight="700" text-anchor="start" style="">Bedrock Knowledge Base</text><text x="44" y="496" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">HUD 4000.1, Regulation B and Z,</text><text x="44" y="513" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">searched passage by passage</text><rect x="320" y="452" width="250" height="92" rx="10" fill="#ffffff" stroke="#c6c6cd" stroke-width="1.2"/><text x="334" y="476" font-size="14" fill="#16191f" font-weight="700" text-anchor="start" style="">AgentCore Observability</text><text x="334" y="496" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">CloudWatch and X-Ray: invocations,</text><text x="334" y="513" font-size="12" fill="#414d5c" font-weight="400" text-anchor="start" style="">latency, errors. Did it run?</text><path d="M155,184 L155,250" fill="none" stroke="#7d8998" stroke-width="1.5" marker-end="url(#ah)"/><rect x="158" y="208" width="54.1" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="162" y="220" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="start" style="">invokes</text><path d="M155,378 L155,452" fill="none" stroke="#7d8998" stroke-width="1.5" marker-end="url(#ah)"/><rect x="158" y="414" width="60.4" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="162" y="426" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="start" style="">searches</text><path d="M280,314 L320,314" fill="none" stroke="#2e5bba" stroke-width="2.4" marker-end="url(#ahD)"/><rect x="276.1" y="294" width="47.8" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="300.0" y="306" font-size="11.5" fill="#2e5bba" font-weight="600" text-anchor="middle" style="">writes</text><path d="M570,314 L610,314" fill="none" stroke="#2e5bba" stroke-width="2.4" marker-end="url(#ahD)"/><rect x="562.95" y="294" width="54.1" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="590.0" y="306" font-size="11.5" fill="#2e5bba" font-weight="600" text-anchor="middle" style="">Streams</text><path d="M860,314 L900,314" fill="none" stroke="#0f7b6c" stroke-width="2.4" marker-end="url(#ahN)"/><rect x="859.25" y="294" width="41.5" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="880.0" y="306" font-size="11.5" fill="#0f7b6c" font-weight="600" text-anchor="middle" style="">MERGE</text><path d="M240,378 L240,498 L320,498" fill="none" stroke="#7d8998" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="246" y="454" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="start" style="">telemetry</text><path d="M280,138 L445,138 L445,250" fill="none" stroke="#7d8998" stroke-width="1.5" marker-end="url(#ah)"/><rect x="339.25" y="120" width="41.5" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="360" y="132" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="middle" style="">reads</text><path d="M900,122 L520,122 L520,250" fill="none" stroke="#7d8998" stroke-width="1.5" marker-end="url(#ah)"/><rect x="714.25" y="104" width="41.5" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="735" y="116" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="middle" style="">reads</text><path d="M1025,184 L1025,250" fill="none" stroke="#7d8998" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1028" y="208" width="41.5" height="17" rx="4" fill="#fff" opacity="0.92"/><text x="1032" y="220" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="start" style="">reads</text><path d="M155,544 L155,580 L1025,580 L1025,378" fill="none" stroke="#7d8998" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="735" y="574" font-size="11.5" fill="#414d5c" font-weight="600" text-anchor="middle" style="">the Knowledge Base keeps its passages in the same graph</text><text x="30" y="612" font-size="12.5" fill="#414d5c" font-weight="400" text-anchor="start" style="">The record never waits on the graph: DynamoDB is written first, and the graph is rebuilt from it. Telemetry says the agent ran, not what it read or why it decided.</text></svg>